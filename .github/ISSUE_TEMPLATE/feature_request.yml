name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What limitation or workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the desired user-visible result and any alternatives considered.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Compatibility notes
      description: Mention affected Windows versions, ISO languages, or trimmed host systems.
